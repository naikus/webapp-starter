<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link id="favicon" rel="icon" type="image/svg+xml" href="branding/default/assets/images/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Web starter with React SPA & Fastify Backend">
    <title></title>
    <style>
      .loading {
        margin: 15% auto 0;
        width: 270px;
        color: #666;
        font-family: sans-serif;
        font-size: 0.8em;
        letter-spacing: 5px;
        background-color: rgba(0,0,0,0.05);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        text-transform: uppercase;
        padding: 12px;
      }
      .loading > .icon {
        width: 50px;
      }

      .loading > .loading-msg {
        padding: 0 0 0 16px;
      }
    </style>
    <!-- script defer src="https://unpkg.com/react-scan/dist/auto.global.js"></script -->
    <!-- 
      Needs script-src-aettr CSP to be set in server's config to 'unsafe-inline' 
      because of the onload event handler below
    -->
    <!-- link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" 
      media="print"
      onload="this.media='all'"
      rel="stylesheet" / -->
  </head>
  <body>
    <div id="root">
      <div class="loading">
        <svg xmlns="http://www.w3.org/2000/svg" width="35" height="35" viewBox="0 0 24 24" 
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="feather-box logo">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
        <div class="loading-msg">Loading App...</div>
      </div>
    </div>
    <script type="module" src="./Bootstrap.jsx"></script>
  </body>
</html>
